# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  build_and_test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [ 22.x ]

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - name: npm ci
        run: npm ci
      - name: Build kb
        run: |
          if [ "${{ github.ref_name }}" == "main" ]; then
            npm run kb:build
          else
            npm run kb:build:staging
          fi
      - name: Build backend
        run: npm run backend:build:prod
      - name: Build storybook
        run: npm run kb:storybook:build
      - name: Test all
        run: npm run all:test
      - name: Lint all
        run: npm run all:lint
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            dist/backend/
            dist/knowledgebase/

  docker_build_and_push:
    needs: build_and_test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || true # github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
      - name: Move artifacts to dist folder
        run: |
          mkdir dist
          mv backend dist/
          mv knowledgebase dist/
      - name: Extract npm version
        id: version
        run: |
          version=$(jq -r '.version' package.json)
          echo "version=$version" >> $GITHUB_ENV

      - name: Docker Login
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login registry.my-knowledgebase.ch -u ${{ secrets.DOCKER_USERNAME }} --password-stdin

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Compute image tag
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "IMAGE_TAG=${{ env.version }}" >> "$GITHUB_ENV"
          else
            echo "IMAGE_TAG=test-${{ env.version }}" >> "$GITHUB_ENV"
          fi

      - name: Build and push backend
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./docker/backend/Dockerfile
          platforms: linux/amd64,linux/arm64/v8
          push: true
          tags: registry.my-knowledgebase.ch/kb-backend:${{ env.IMAGE_TAG }}

      - name: Build and push ui
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./docker/knowledgebase/Dockerfile
          platforms: linux/amd64,linux/arm64/v8
          push: true
          tags: registry.my-knowledgebase.ch/kb-ui:${{ env.IMAGE_TAG }}
